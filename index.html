<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>The Listener</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:#cfc6c6;font:15px/1.5 system-ui,Segoe UI,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#c{display:block;width:100%;height:100%}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,#000c 100%);z-index:2}
#grain{position:fixed;inset:-60px;pointer-events:none;opacity:.07;mix-blend-mode:overlay;z-index:3;animation:gr .7s steps(6) infinite}
@keyframes gr{0%{transform:translate(0,0)}20%{transform:translate(-31px,17px)}40%{transform:translate(23px,-41px)}60%{transform:translate(-47px,-9px)}80%{transform:translate(12px,38px)}100%{transform:translate(0,0)}}
#fade{position:fixed;inset:0;background:#000;opacity:1;pointer-events:none;z-index:9}
#hud{position:fixed;left:14px;top:12px;font-size:12px;color:#7d7070;z-index:5;pointer-events:none;line-height:1.6}
#obj{position:fixed;left:14px;top:40px;font-size:14px;color:#d8c9a0;z-index:5;pointer-events:none;opacity:0;transition:opacity .8s;max-width:60vw;text-shadow:0 1px 3px #000}
#sub{position:fixed;left:50%;bottom:7%;transform:translateX(-50%);max-width:760px;width:90%;text-align:center;z-index:6;pointer-events:none;min-height:3em}
#sub span{display:inline-block;background:#000b;padding:6px 12px;border-radius:4px;font-size:17px;color:#f0e8e8}
#sub b{display:block;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#c24a4a;margin-bottom:2px}
#room{position:fixed;left:50%;top:11%;transform:translateX(-50%);font-size:13px;letter-spacing:4px;text-transform:uppercase;color:#c8bcbc;opacity:0;transition:opacity 1.2s;z-index:5;pointer-events:none}
#prompt{position:fixed;left:50%;top:60%;transform:translateX(-50%);z-index:5;background:#000a;border:1px solid #3a2a2a;padding:6px 14px;border-radius:4px;display:none;pointer-events:none}
#hold{position:fixed;left:50%;top:67%;transform:translateX(-50%);width:220px;height:6px;background:#241418;z-index:5;display:none}#hold i{display:block;height:100%;width:0;background:#e24a4a}
#cross{position:fixed;left:50%;top:50%;width:4px;height:4px;margin:-2px;background:#fff6;border-radius:50%;z-index:5;pointer-events:none}
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:34px;letter-spacing:6px;text-transform:uppercase;color:#e8dede;z-index:10;opacity:0;transition:opacity 1s;pointer-events:none;text-align:center}
#title small{font-size:13px;letter-spacing:8px;color:#c24a4a;margin-bottom:8px}
#note{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);max-width:420px;background:#d9cfb4;color:#2a241a;padding:18px 22px;border-radius:2px;z-index:7;display:none;font:14px/1.7 "Courier New",monospace;box-shadow:0 8px 40px #000;pointer-events:none}
#choice{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:8;display:none;background:#0a0709ee;border:1px solid #4a2a2e;padding:20px 26px;border-radius:8px;text-align:center}
#choice b{display:block;margin-bottom:12px;font-size:18px;color:#fff}#choice button{display:block;width:240px;margin:8px auto;padding:10px;background:#1a0f13;border:1px solid #6a2a2e;color:#eee;border-radius:6px;font:inherit;cursor:pointer;pointer-events:auto}
#choice button:hover{background:#3a1216}#choice small{color:#8a7a7a}
#ending{position:fixed;inset:0;z-index:12;background:#030204;display:none;align-items:center;justify-content:center;text-align:center;padding:24px}
#ending h1{color:#e24a4a;letter-spacing:6px;font-size:16px;margin:0 0 6px}#ending p{max-width:480px;margin:10px auto;color:#9a8c8c}
#ending button{margin-top:14px;background:#e24a4a;border:0;color:#fff;padding:11px 26px;border-radius:6px;font:inherit;cursor:pointer}
#pause{position:fixed;inset:0;z-index:8;background:#0008;display:none;align-items:center;justify-content:center;font-size:18px;letter-spacing:3px;cursor:pointer}
#load{position:fixed;inset:0;z-index:20;background:#06050a;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:20px}
#load h1{margin:0;color:#e24a4a;font-size:26px;letter-spacing:6px}#bar{width:280px;height:4px;background:#241418}#bar i{display:block;height:100%;width:0;background:#e24a4a;transition:width .3s}
#menu{display:flex;flex-direction:column;gap:10px;align-items:center}#menu button,.nights button{background:#1a0f13;border:1px solid #6a2a2e;color:#eee;padding:11px 28px;border-radius:6px;font:inherit;cursor:pointer;min-width:240px}
#menu button:hover:not(:disabled){background:#3a1216}#menu button:disabled{opacity:.35;cursor:default}.nights{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:380px}.nights button{min-width:0;padding:8px 14px;font-size:13px}
#fps{position:fixed;right:12px;top:10px;font:11px monospace;color:#6a6060;z-index:5;display:none}
#touch{display:none;position:fixed;inset:0;z-index:6;pointer-events:none}
#stick{position:absolute;left:24px;bottom:28px;width:130px;height:130px;border-radius:50%;background:#ffffff14;border:1px solid #ffffff30;pointer-events:auto;touch-action:none}
#stick i{position:absolute;left:41px;top:41px;width:48px;height:48px;border-radius:50%;background:#ffffff40}
.tb{position:absolute;right:24px;width:64px;height:64px;border-radius:50%;background:#ffffff1a;border:1px solid #ffffff40;color:#fff;font:600 16px system-ui;display:flex;align-items:center;justify-content:center;pointer-events:auto}
</style></head><body>
<canvas id="c"></canvas><div id="vig"></div><div id="grain"></div><div id="fade"></div>
<div id="hud">WASD move &nbsp; Mouse look &nbsp; Shift run &nbsp; F flashlight &nbsp; E interact &nbsp; Q quality &nbsp; P fps</div>
<div id="obj"></div><div id="room"></div><div id="prompt"></div><div id="hold"><i></i></div><div id="cross"></div><div id="fps"></div><div id="sub"></div><div id="note"></div><div id="title"></div>
<div id="choice"></div><div id="ending"></div><div id="pause">CLICK TO RESUME</div>
<div id="touch"><div id="stick"><i></i></div><div class="tb" id="tE" style="bottom:110px">E</div><div class="tb" id="tF" style="bottom:28px">F</div></div>
<div id="load"><h1>THE LISTENER</h1><div id="msg">Loading bunker...</div><div id="bar"><i id="bi"></i></div><div id="menu"></div><div style="font-size:12px;color:#6d6060;max-width:430px">Five nights in a bunker help line. Headphones strongly recommended. Click inside the game to capture the mouse, Esc releases it. Contains unsettling sounds.</div></div>
<script>
(function(){const c=document.createElement('canvas');c.width=c.height=160;const g=c.getContext('2d'),im=g.createImageData(160,160);for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}g.putImageData(im,0,0);document.getElementById('grain').style.backgroundImage='url('+c.toDataURL()+')'})();
</script>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
<script type="module" src="game.js"></script>
</body></html>
